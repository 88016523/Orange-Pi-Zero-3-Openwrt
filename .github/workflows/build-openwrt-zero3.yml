#
# Build OpenWrt firmware for Orange Pi Zero 3 (Allwinner H618)
# Based on ImmortalWrt with AW859A / UWE5622 Wi-Fi support
#

name: Build OpenWrt Zero 3

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: orange-pi-zero3.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker system prune -a -f
        df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang llvm lld cmake cpio curl device-tree-compiler \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
          haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-pyelftools \
          python3-setuptools qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
          zlib1g-dev

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
    - name: Check host compiler
      run: |
        clang++ --version
        printf 'int main() { return 0; }\n' \
          | clang++ -std=c++23 -x c++ -c -o /tmp/cxx23-test.o -
          
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT "$PWD"
        git clone --depth 1 --filter=blob:none \
          "$REPO_URL" \
          -b "$REPO_BRANCH" \
          openwrt

        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Load custom feeds
      run: |
        if [ -e "$FEEDS_CONF" ]; then
          mv "$FEEDS_CONF" openwrt/feeds.conf.default
        fi

        chmod +x "$DIY_P1_SH"

        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        if [ -e files ]; then
          mv files openwrt/files
        fi

        if [ -e "$CONFIG_FILE" ]; then
          mv "$CONFIG_FILE" openwrt/.config
        fi

        chmod +x "$DIY_P2_SH"

        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Generate final configuration
      run: |
        cd openwrt
        make defconfig

    - name: Verify requested packages
      run: |
        cd openwrt

        fail=0

        required_packages="
        luci-app-mwan3
        luci-app-ttyd
        luci-app-filemanager
        luci-app-passwall
        luci-app-passwall2
        luci-app-diskman
        luci-app-easytier
        dnsmasq-full
        chinadns-ng
        ip-full
        coreutils-base64
        coreutils-nohup
        luci-theme-argon
        luci-app-firewall
        luci-app-package-manager
        kmod-uwe5622
        uwe5622-firmware
        wpad-basic-mbedtls
        iw-full
        "

        for package in $required_packages; do
          if grep -q "^CONFIG_PACKAGE_${package}=y" .config; then
            echo "OK: ${package}"
          else
            echo "MISSING: ${package}"
            fail=1
          fi
        done

        if grep -q "^CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y" .config; then
          echo "OK: Orange Pi Zero 3 target"
        else
          echo "MISSING: Orange Pi Zero 3 target"
          fail=1
        fi

        if grep -q "^CONFIG_LUCI_LANG_zh_Hans=y" .config; then
          echo "OK: Simplified Chinese LuCI language"
        else
          echo "MISSING: Simplified Chinese LuCI language"
          fail=1
        fi

        translation_packages="
        luci-i18n-mwan3-zh-cn
        luci-i18n-ttyd-zh-cn
        luci-i18n-passwall-zh-cn
        luci-i18n-passwall2-zh-cn
        luci-i18n-diskman-zh-cn
        luci-i18n-firewall-zh-cn
        luci-i18n-package-manager-zh-cn
        "

        for package in $translation_packages; do
          if grep -q "^CONFIG_PACKAGE_${package}=y" .config; then
            echo "OK translation: ${package}"
          elif grep -q "^# CONFIG_PACKAGE_${package} is not set" .config; then
            echo "WARNING translation dropped by defconfig: ${package}"
          else
            echo "WARNING translation unavailable: ${package}"
          fi
        done

        forbidden_packages="
        luci-app-store
        luci-app-quickstart
        luci-app-openclash
        luci-app-docker
        luci-app-dockerman
        luci-app-aria2
        luci-app-zerotier
        docker
        dockerd
        containerd
        runc
        aria2
        ariang
        "

        for package in $forbidden_packages; do
          if grep -q "^CONFIG_PACKAGE_${package}=y" .config; then
            echo "FORBIDDEN PACKAGE ENABLED: ${package}"
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "Configuration verification failed."
          exit 1
        fi

        echo "Configuration verification passed."

    - name: Download package
      run: |
        cd openwrt

        make download -j"$(nproc)" || \
        make download -j8 V=s

        find dl -size -1024c -delete

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt

        echo "Using $(($(nproc) - 1)) cores for compilation"

        make -j"$(($(nproc) - 1))" || \
        make -j2 || \
        make -j1 V=s

        echo "status=success" >> "$GITHUB_OUTPUT"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME

        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check space usage
      if: (!cancelled())
      run: |
        df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize firmware files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*

        rm -rf packages

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"

        touch release.txt

        echo "- Orange Pi Zero 3 (H618) / ImmortalWrt" >> release.txt
        echo "- AW859A / UWE5622 Wi-Fi driver and firmware included" >> release.txt
        echo "- PassWall / PassWall2 / mwan3 / ttyd / EasyTier included" >> release.txt

        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Post-cleanup
      run: |
        sudo rm -rf /workdir/openwrt/dl
        df -h
